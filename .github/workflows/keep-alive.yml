# Render ücretsiz planı 15 dk boşta kalınca uyur; uyanması ~90 sn sürer ve bu sürede
# gece 04:00 senkronizasyonu ile 09:00 hatırlatmaları da çalışmaz. Bu iş sunucuyu
# 10 dakikada bir yoklayarak uyanık tutar.
#
# - Yalnızca /actuator/health/liveness çağrılır: veritabanına DOKUNMAZ, böylece Neon
#   kullanılmadığında uyuyabilir (bağlantı havuzu minimum-idle=0).
# - Render ücretsiz planı ayda 750 saat verir; tek servis 7/24 ≈ 744 saat, sığar.
# - Herkese açık depoda GitHub Actions ücretsizdir. GitHub, 60 gün commit olmayan
#   depolarda zamanlanmış işleri durdurur; o durumda Actions sekmesinden yeniden aç.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping liveness
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://concertly-api.onrender.com/actuator/health/liveness' }}
        run: |
          curl -fsS --max-time 120 --retry 2 --retry-delay 10 "$URL" || echo "ping basarisiz (sunucu uyaniyor olabilir)"
