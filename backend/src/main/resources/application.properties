# Concertly backend yapılandırması
# -----------------------------------------------------------------------------
# Bu dosya commit EDİLİR ama içinde GERÇEK secret YOKTUR.
# Tüm hassas değerler ${ENV_DEGISKENI:güvenli-default} biçiminde okunur:
#   - Production: env değişkenleri (DB_URL, JWT_SECRET, ... ) devreye girer.
#   - Yerel geliştirme: aşağıdaki default'lar kullanılır (gerçek API anahtarların
#     için yerelde env değişkeni ver ya da gitignore'lu application-local.properties kullan).
# -----------------------------------------------------------------------------

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/concertly_mobile}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# Yerel geliştirme mevcut Hibernate şemasını güncelleyebilir. Production'da
# DDL_AUTO=validate ve FLYWAY_ENABLED=true kullan; şema değişikliklerini SQL
# migration dosyalarıyla uygula.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
server.port=${PORT:8082}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# SMTP varsayılan olarak kapalıdır; bu durumda erişilemeyen SMTP sunucusunun
# uygulamayı health endpoint'inde DOWN göstermesine izin verme.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# Virgülle ayrılmış güvenilir istemci origin'leri. Production'da CORS_ALLOWED_ORIGIN_PATTERNS
# değerini sadece yayımlanan uygulama alan adlarıyla sınırlandır.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://concertly-backend.onrender.com}

# İlk canlı sürümün etkinlik ve şehir kapsamı.
# NOT: .properties dosyalari Spring tarafindan ISO-8859-1 olarak okunur.
# Turkce karakterler \uXXXX kacisiyla yazilmali; duz UTF-8 yazilirsa
# deger mojibake olur ve sehir eslesmesi SESSIZCE bozulur (Istanbul listesi bos doner).
app.launch.cities=${LAUNCH_CITIES:\u0130stanbul,Ankara,\u0130zmir,Antalya}

# Konser katilim dogrulamasi (GPS). Karar sunucuda verilir; istemci yalnizca
# koordinat tasir. Buyuk mekanlarda (stadyum/festival alani) GPS sapmasi icin
# 500 m makul bir taban; daraltmak icin env ile override et.
app.verification.max-distance-meters=${VERIFY_MAX_DISTANCE_METERS:500}
app.verification.window-hours-before=${VERIFY_WINDOW_HOURS_BEFORE:6}
app.verification.window-hours-after=${VERIFY_WINDOW_HOURS_AFTER:12}
app.verification.reject-mock-location=${VERIFY_REJECT_MOCK_LOCATION:true}

# Push bildirimleri (Expo Push API).
# PUSH_ENABLED=false yaparsan bildirimler yalnızca veritabanına yazılır, cihaza gitmez.
# EXPO_ACCESS_TOKEN yalnızca Expo hesabında "Enhanced Security" açıksa gerekir.
app.push.enabled=${PUSH_ENABLED:true}
app.push.expo-endpoint=${EXPO_PUSH_ENDPOINT:https://exp.host/--/api/v2/push/send}
app.push.expo-access-token=${EXPO_ACCESS_TOKEN:}

# Paylaşım linkleri — uygulama yüklü değilse açılacak web adresi.
app.share.base-url=${SHARE_BASE_URL:https://concertly-backend.onrender.com}
app.share.ios-app-id=${IOS_APP_ID:}
app.share.android-package=${ANDROID_PACKAGE:com.concertly.app}
app.share.ios-bundle-id=${IOS_BUNDLE_ID:com.concertly.app}
app.share.app-scheme=${APP_SCHEME:concertly}

# Moderasyon — yeni hesaplara gunluk uretim tavani (spam yavaslatma).
# NEW_ACCOUNT_HOURS=0 yaparsan limit tamamen kapanir.
app.moderation.new-account-hours=${NEW_ACCOUNT_HOURS:48}
app.moderation.new-account-max-posts-per-day=${NEW_ACCOUNT_MAX_POSTS:10}
app.moderation.new-account-max-comments-per-day=${NEW_ACCOUNT_MAX_COMMENTS:50}
app.moderation.new-account-max-messages-per-day=${NEW_ACCOUNT_MAX_MESSAGES:50}

# Görsel yükleme
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# JWT — prod'da JWT_SECRET env ile GÜÇLÜ bir secret ver.
# Aşağıdaki default SADECE yerel geliştirme içindir, prod'da kullanma.
jwt.secret=${JWT_SECRET:dev-local-only-secret-do-not-use-in-production-0123456789abcdef}
jwt.expiration.ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh.expiration.days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Spotify — anahtarları env ile ver (boş bırakılırsa Spotify zenginleştirme çalışmaz, uygulama yine açılır)
spotify.client.id=${SPOTIFY_CLIENT_ID:29b4fc51e0014d558bf59dedf028160d}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET:fd2a571c7477465ca7ff62a90a005789}
spotify.redirect.uri=${SPOTIFY_REDIRECT_URI:http://localhost:8082/api/spotify/callback}

# Ticketmaster — anahtarı env ile ver (boş bırakılırsa otomatik etkinlik çekme çalışmaz)
ticketmaster.api.key=${TICKETMASTER_API_KEY:Qg3SwTdUazaGgzWYXxNKGh711tfVlBtl}

# Admin bootstrap — bu e-postaya sahip kullanıcı açılışta ROLE_ADMIN yapılır
# (taze DB'de ilk admin'i oluşturmak için; boş bırakılırsa devre dışı)
admin.bootstrap.email=${ADMIN_EMAIL:}

# E-posta (şifre sıfırlama kodu için) — Gmail SMTP.
# Production'da: MAIL_ENABLED=true, MAIL_USERNAME=gmail adresin, MAIL_PASSWORD=Gmail App Password.
# MAIL_ENABLED=false (varsayılan) ise kod yalnızca sunucu loguna yazılır (yerel geliştirme).
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Concertly <no-reply@concertly.app>}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
