      "description": "Garanti BBVA Genç Konserleri: Neo Turkish Psych by Gaye Su Akyol, 21 Kasım’da Zorlu PSM’de!&#xA;Anadolu’nun kadim seslerini psikedelik rock, post-punk, elektronik müzik ve daha fazlasıyla buluşturan özgün müzik dünyasının öncü isimlerinden Gaye Su Akyol, bu kez küratörlüğünü üstlendiği Neo Turkish Psych ile dinleyicileri farklı bir ses evrenine davet ediyor.&#xA;Geleneksel Anadolu müziği, Klasik Türk müziği ve Anadolu rock’ını çağdaş türlerle buluşturan üretimleriyle uluslararası sahnede kendine özgü bir yer edinen Gaye Su Akyol; The New York Times, Pitchfork, The Guardian ve Songlines gibi önemli mecraların övgüsünü kazandı. Kendi müziğini “kavram olarak evrensel, ruh olarak yerel” olarak tanımlayan sanatçı, Neo Turkish Psych ile farklı dönemlerden ve coğrafyalardan gelen Anadolu seslerini bugünün müzikal dünyasıyla yeniden buluşturuyor.&#xA;Bu akşam Zorlu PSM’de sahne alacak isimler arasında Ali Güçlü Şimşek ve Barlas Tan Özemek’ten oluşan Lalalar da yer alıyor. 2019’da yayımladıkları “İsyanlar” teklisiyle yerli psikedelik sahneye güçlü bir giriş yapan grup; 70’lerin arabesk ruhunu fütüristik bir yaklaşımla yeniden yorumluyor. Sinematik retro basları, elektronik beat’leri, kirli gitarları ve özgün vokalleri Anadolu ezgileriyle buluşturuyor.&#xA;“Hata Benim Göbek Adım”, “Yalnız Ölü Balıklar Akıntıyı Takip Eder”, “Hiç Mutlu Olmam Daha İyi” ve “Ninja Partisi” gibi parçalarıyla kendi sound’unu oluşturan Lalalar, Bi Cinnete Bakar (2022) ve En Kötü İyi Olur (2023) albümleriyle müzikal dünyasını genişletti. Türkiye’den dünyaya uzanan sahnelerde enerjik canlı performanslarıyla dikkat çeken grup, Neo Turkish Psych gecesinde Zorlu PSM sahnesinde olacak.&#xA;“Türk usulü kulüp” hissini psikedelik, alaturka ve dans müziğiyle buluşturan Alaturca Club da bu akşamda Zorlu PSM’de sahne alacak. 2022 yılında Göksu Taşçeviren (Sufle), Mustafa Atik (Sufle) ve Nurettin Çolak (Ethnu) tarafından kurulan grup, yayımladığı teklilerin ardından ilk albümü Club Alaturca’yı 2024’te dinleyicilerle buluşturdu.&#xA;Geleneksel tınıları psikedelik dokular ve dans ritimleriyle bir araya getiren Alaturca Club, kendine özgü müzik dünyasıyla Neo Turkish Psych akşamında sahnede olacak.&#xA;Gaye Su Akyol, Lalalar ve Alaturca Club’a, 15 yılı aşkın süredir dünyanın farklı coğrafyalarında dans pistlerini hareketlendiren usta seçici DJ Fitz eşlik edecek.&#xA;Avrupa’nın underground kulüplerinden Amerika, Kanada, Orta Doğu ve Avustralya’ya uzanan performanslarıyla tanınan DJ Fitz; disco, psikedelik funk ve farklı coğrafyaların ritimlerini buluşturan seçkileriyle kendine özgü bir müzikal dünya kuruyor. Derin groove’lardan sürprizli keşiflere uzanan setlerinde, nadir parçaları çağdaş dokunuşlarla bir araya getirerek hipnotik ve dans odaklı yolculuklar yaratıyor. Müzik konusundaki güçlü sezgisi ve özgün seçkileriyle dikkat çeken DJ Fitz, Neo Turkish Psych gecesinde dans pistini hareketlendirecek.&#xA;Gaye Su Akyol’un küratörlüğünde gerçekleşecek Garanti BBVA Genç Konserleri: Neo Turkish Psych, geleneksel ile çağdaş, yerel ile evrensel arasındaki sınırları yeniden düşünmek isteyen herkesi Zorlu PSM’ye bekliyor.&#xA;",
