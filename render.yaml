# Concertly backend — Render (ÜCRETSİZ) + Neon PostgreSQL.
#
# Canlıdaki servis panelden elle kuruldu (Blueprint'e bağlı değil); bu dosya o
# kurulumun belgesi ve olası bir Blueprint'in YANLIŞLIKLA ücretli kaynak
# açmasını engellemek içindir:
#   - plan: free (ücretli instance yok)
#   - disk YOK (free planda kalıcı disk yok; yüklenen görseller her deploy /
#     yeniden başlatmada silinir — bilinen kısıt)
#   - Render PostgreSQL YOK: veritabanı Neon'dadır (DB_URL/DB_USERNAME/DB_PASSWORD)
#
# Secret değerleri buraya YAZILMAZ; "sync: false" alanları panelden girilir.
services:
  - type: web
    name: concertly-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Deploy yalnızca bilinçli olarak başlatılsın (push = otomatik deploy olmasın)
    autoDeploy: false
    # Veritabanına DOKUNMAYAN kontrol: /actuator/health DB'yi de yoklar ve Render'ın
    # sürekli sağlık kontrolü Neon'un hiç uyumamasına (ücretsiz kotanın bitmesine) yol açar.
    healthCheckPath: /actuator/health/liveness
    envVars:
      # --- Veritabanı (Neon, doğrudan bağlantı — "-pooler" OLMAYAN host) -----------
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # --- Şema yönetimi: Flyway uygular, Hibernate yalnızca doğrular -----------------
      - key: FLYWAY_ENABLED
        value: "true"
      # Mevcut (Flyway öncesi) şemayı V1 sayar, ardından V2..V6'yı uygular.
      # Geçmiş tablosu oluştuktan sonra etkisizdir; açık kalması güvenlidir.
      - key: FLYWAY_BASELINE_ON_MIGRATE
        value: "true"
      - key: FLYWAY_BASELINE_VERSION
        value: "1"
      - key: DDL_AUTO
        value: validate

      # --- Secret'lar (panelden) ------------------------------------------------------
      - key: JWT_SECRET
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

      # --- Uygulama ayarları ----------------------------------------------------------
      - key: APP_TIMEZONE
        value: Europe/Istanbul
      - key: LAUNCH_CITIES
        value: İstanbul,Ankara,İzmir,Antalya
      - key: JPA_SHOW_SQL
        value: "false"
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://concertly-api.onrender.com
      - key: SHARE_BASE_URL
        value: https://concertly-api.onrender.com
